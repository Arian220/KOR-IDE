<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi IDE Arduino - MVP</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100vh;
            box-sizing: border-box;
            margin: 0;
        }
        .contenedor {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .panel-izquierdo {
            background-color: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 450px; /* Un poco más ancho para la placa */
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .panel-derecho {
            flex: 1;
            background-color: #252526;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Cabecera del panel derecho y botones */
        .panel-derecho h3 {
            margin: 0;
            padding: 10px 15px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .botones-accion {
            display: flex;
            gap: 10px;
        }
        button {
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:disabled { cursor: not-allowed; opacity: 0.7; }
        
        #btnCompilar { background-color: #007acc; }
        #btnCompilar:hover { background-color: #005999; }
        
        #btnSubir { background-color: #e67e22; }
        #btnSubir:hover { background-color: #d35400; }

        /* Panel de Memoria */
        .memory-panel {
            padding: 15px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            display: none;
        }
        .memory-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .progress-bar {
            flex: 1;
            height: 12px;
            background-color: #1e1e1e;
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #4fc08d;
            transition: width 0.3s ease;
        }
        #console-output {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #111;
            color: #f55;
            font-size: 12px;
            max-height: 100px;
            overflow-y: auto;
            border-radius: 4px;
            font-family: monospace;
        }

        /* Editor CodeMirror */
        #editor-container { flex: 1; overflow: auto; }
        .cm-editor { height: 100%; }
        .cm-scroller { font-family: 'Courier New', Courier, monospace !important; }

        /* Contenedor del SVG */
        #svg-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            overflow: hidden;
            cursor: grab;
            position: relative;
        }
        #svg-container:active { cursor: grabbing; }
        
        #svg-container svg {
            max-width: none;
            max-height: none;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
        }

        /* Menú flotante de configuración del pin */
        .menu-pin {
            display: none;
            position: absolute;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 5px;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .menu-pin select {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 3px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Generador Visual + Compilador</h1>
    
    <div class="contenedor">
        <!-- PANEL IZQUIERDO: Placa -->
        <div class="panel-izquierdo">
            <h3>Arduino UNO (Rueda del ratón para Zoom)</h3>
            <div id="svg-container">Cargando placa...</div>
        </div>

        <!-- PANEL DERECHO: Editor y Memoria -->
        <div class="panel-derecho">
            <h3>
                Código Generado (Editable)
                <div class="botones-accion">
                    <button id="btnCompilar">⚙️ Compilar</button>
                    <button id="btnSubir">🚀 Subir a la Placa</button>
                </div>
            </h3>
            
            <div class="memory-panel" id="memory-panel">
                <div class="memory-row">
                    <span style="width: 120px;">Flash (Programa):</span>
                    <div class="progress-bar"><div class="progress-fill" id="bar-flash"></div></div>
                    <span id="text-flash" style="width: 80px; text-align: right;">0%</span>
                </div>
                <div class="memory-row">
                    <span style="width: 120px;">SRAM (Variables):</span>
                    <div class="progress-bar"><div class="progress-fill" id="bar-sram"></div></div>
                    <span id="text-sram" style="width: 80px; text-align: right;">0%</span>
                </div>
                <pre id="console-output"></pre>
            </div>

            <div id="editor-container"></div>
        </div>
    </div>

    <!-- Menú flotante oculto -->
    <div class="menu-pin" id="menu-pin">
        <select id="selector-funcion">
            <option value="ninguno">-- Quitar configuración --</option>
            <option value="salida">Salida Digital (Parpadear)</option>
            <option value="entrada">Entrada Digital (Leer)</option>
            <option value="pwm">Salida PWM (Atenuar)</option>
        </select>
    </div>

    <script type="module">
        import { EditorView, basicSetup } from "https://esm.sh/codemirror@6.0.1";
        import { cpp } from "https://esm.sh/@codemirror/lang-cpp@6.0.2";
        import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6.1.2";

        // ==========================================
        // 1. CONFIGURACIÓN DEL EDITOR
        // ==========================================
        const editor = new EditorView({
            doc: "// Esperando configuración...\n",
            extensions: [basicSetup, cpp(), oneDark],
            parent: document.getElementById('editor-container')
        });

        function setEditorText(nuevoTexto) {
            editor.dispatch({ changes: { from: 0, to: editor.state.doc.length, insert: nuevoTexto } });
        }

        // ==========================================
        // 2. VARIABLES GLOBALES Y ESTADO
        // ==========================================
        const estadoPines = {}; 
        const menu = document.getElementById('menu-pin');
        const selector = document.getElementById('selector-funcion');
        const contenedorSVG = document.getElementById('svg-container');
        let pinActual = null;

        // Variables para Zoom y Pan
        let escala = 1.0;
        let posX = 0;
        let posY = 0;
        let isDragging = false;
        let startX, startY;

        // ==========================================
        // 3. CARGA DEL SVG Y CREACIÓN DE PINES
        // ==========================================
        async function cargarSVG() {
            try {
                const respuesta = await fetch('arduino-uno.svg');
                const svgTexto = await respuesta.text();
                contenedorSVG.innerHTML = svgTexto;

                const svgElement = contenedorSVG.querySelector('svg');
                
                // Coordenadas EXACTAS extraídas de los agujeros <circle> del SVG
                const pinesCoordenadas = [
                    // Fila Superior (Digitales)
                    { pin: '13', cx: 134.8, cy: 19 },
                    { pin: '12', cx: 143.8, cy: 19 },
                    { pin: '11', cx: 152.8, cy: 19 },
                    { pin: '10', cx: 161.8, cy: 19 },
                    { pin: '9',  cx: 170.8, cy: 19 },
                    { pin: '8',  cx: 179.8, cy: 19 },
                    { pin: '7',  cx: 194.2, cy: 19 },
                    { pin: '6',  cx: 203.2, cy: 19 },
                    { pin: '5',  cx: 212.2, cy: 19 },
                    { pin: '4',  cx: 221.2, cy: 19 },
                    { pin: '3',  cx: 230.2, cy: 19 },
                    { pin: '2',  cx: 239.2, cy: 19 },
                    { pin: '1',  cx: 248.2, cy: 19 }, // TX
                    { pin: '0',  cx: 257.2, cy: 19 }, // RX

                    // Fila Inferior (Analógicos)
                    { pin: 'A0', cx: 212.2, cy: 190 },
                    { pin: 'A1', cx: 221.2, cy: 190 },
                    { pin: 'A2', cx: 230.2, cy: 190 },
                    { pin: 'A3', cx: 239.2, cy: 190 },
                    { pin: 'A4', cx: 248.2, cy: 190 },
                    { pin: 'A5', cx: 257.2, cy: 190 }
                ];

                const capaInteractiva = document.createElementNS("http://www.w3.org/2000/svg", "g");
                svgElement.appendChild(capaInteractiva);

                pinesCoordenadas.forEach(p => {
                    const circulo = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circulo.setAttribute('cx', p.cx);
                    circulo.setAttribute('cy', p.cy);
                    circulo.setAttribute('r', 4.5);
                    circulo.setAttribute('fill', 'rgba(0, 255, 204, 0.1)'); 
                    circulo.setAttribute('stroke', '#00ffcc');
                    circulo.setAttribute('stroke-width', '0.7');
                    circulo.style.cursor = 'pointer';
                    circulo.setAttribute('data-pin', p.pin);

                    circulo.addEventListener('mouseenter', () => circulo.setAttribute('fill', 'rgba(0, 255, 204, 0.5)'));
                    circulo.addEventListener('mouseleave', () => {
                        const estado = estadoPines[p.pin];
                        if (estado === 'salida') circulo.setAttribute('fill', 'rgba(79, 192, 141, 0.6)');
                        else if (estado === 'entrada') circulo.setAttribute('fill', 'rgba(0, 122, 204, 0.6)');
                        else if (estado === 'pwm') circulo.setAttribute('fill', 'rgba(215, 186, 125, 0.6)');
                        else circulo.setAttribute('fill', 'rgba(0, 255, 204, 0.1)');
                    });

                    circulo.addEventListener('click', (e) => {
                        e.stopPropagation();
                        pinActual = p.pin;
                        const panelRect = document.querySelector('.panel-izquierdo').getBoundingClientRect();
                        const rect = circulo.getBoundingClientRect();
                        
                        menu.style.display = 'block';
                        menu.style.top = (rect.top - panelRect.top + 10) + 'px';
                        menu.style.left = (rect.left - panelRect.left + 10) + 'px';
                        selector.value = estadoPines[pinActual] || 'ninguno';
                    });

                    capaInteractiva.appendChild(circulo);
                });

            } catch (error) {
                console.error("Error cargando el SVG:", error);
                contenedorSVG.innerText = "Error al cargar arduino-uno.svg";
            }
        }

        // ==========================================
        // 4. ZOOM Y PAN (ARRASTRAR)
        // ==========================================
        contenedorSVG.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factorZoom = e.deltaY < 0 ? 1.1 : 0.9;
            escala *= factorZoom;
            if (escala < 0.5) escala = 0.5;
            if (escala > 5) escala = 5;
            const svg = contenedorSVG.querySelector('svg');
            if (svg) svg.style.transform = `translate(${posX}px, ${posY}px) scale(${escala})`;
        });

        contenedorSVG.addEventListener('mousedown', (e) => {
            if (e.target.tagName.toLowerCase() === 'circle') return; // No arrastrar si clica un pin
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            const svg = contenedorSVG.querySelector('svg');
            if (svg) svg.style.transform = `translate(${posX}px, ${posY}px) scale(${escala})`;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // ==========================================
        // 5. LÓGICA DE GENERACIÓN DE CÓDIGO
        // ==========================================
        selector.addEventListener('change', () => {
            const funcionElegida = selector.value;
            if (funcionElegida === 'ninguno') delete estadoPines[pinActual]; 
            else estadoPines[pinActual] = funcionElegida;
            
            actualizarVisual();
            generarCodigo();
            menu.style.display = 'none';
        });

        document.addEventListener('click', () => { menu.style.display = 'none'; });
        menu.addEventListener('click', (e) => { e.stopPropagation(); });

        function actualizarVisual() {
            const todosLosPines = document.querySelectorAll('#svg-container circle');
            todosLosPines.forEach(circulo => {
                const id = circulo.getAttribute('data-pin');
                if (!id) return;
                if (estadoPines[id] === 'salida') circulo.setAttribute('fill', 'rgba(79, 192, 141, 0.6)');
                else if (estadoPines[id] === 'entrada') circulo.setAttribute('fill', 'rgba(0, 122, 204, 0.6)');
                else if (estadoPines[id] === 'pwm') circulo.setAttribute('fill', 'rgba(215, 186, 125, 0.6)');
                else circulo.setAttribute('fill', 'rgba(0, 255, 204, 0.1)');
            });
        }

        function generarCodigo() {
            const pinesConfigurados = Object.keys(estadoPines);
            if (pinesConfigurados.length === 0) {
                setEditorText("// Esperando configuración...\n");
                return;
            }

            let codigo = "// === BEGIN PIN CONFIG ===\n";
            pinesConfigurados.forEach(pin => codigo += `const int PIN_${pin} = ${pin};\n`);
            codigo += "\nvoid setup() {\n";
            pinesConfigurados.forEach(pin => {
                const func = estadoPines[pin];
                if (func === 'salida') codigo += `  pinMode(PIN_${pin}, OUTPUT);\n`;
                if (func === 'entrada') codigo += `  pinMode(PIN_${pin}, INPUT_PULLUP);\n`;
                if (func === 'pwm') codigo += `  pinMode(PIN_${pin}, OUTPUT);\n`;
            });
            codigo += "}\n\nvoid loop() {\n";
            pinesConfigurados.forEach(pin => {
                const func = estadoPines[pin];
                if (func === 'salida') codigo += `  // Parpadear Pin ${pin}\n  digitalWrite(PIN_${pin}, HIGH);\n  delay(500);\n  digitalWrite(PIN_${pin}, LOW);\n  delay(500);\n`;
                if (func === 'entrada') codigo += `  // Leer Pin ${pin}\n  int valor_${pin} = digitalRead(PIN_${pin});\n`;
                if (func === 'pwm') codigo += `  // Atenuar Pin ${pin}\n  for(int i=0; i<=255; i+=5) { analogWrite(PIN_${pin}, i); delay(10); }\n`;
            });
            codigo += "}\n\n// === END PIN CONFIG ===\n\n// --- ESCRIBE TU CÓDIGO PERSONALIZADO AQUÍ ABAJO ---\n";
            setEditorText(codigo);
        }

        // ==========================================
        // 6. COMPILACIÓN Y MEMORIA
        // ==========================================
        document.getElementById('btnCompilar').addEventListener('click', async () => {
            const btn = document.getElementById('btnCompilar');
            btn.innerText = "⏳ Compilando...";
            btn.disabled = true;
            
            const codigoActual = editor.state.doc.toString();
            
            try {
                const cliPath = 'C:\\ArduinoCLI\\arduino-cli.exe'; // Tu ruta
                const resultado = await window.api.compilar(codigoActual, cliPath);
                
                document.getElementById('memory-panel').style.display = 'block';
                const consola = document.getElementById('console-output');
                
                if (resultado.success) {
                    consola.style.display = 'none';
                    parsearMemoria(resultado.stdout, resultado.stderr);
                } else {
                    consola.style.display = 'block';
                    consola.textContent = resultado.stderr || resultado.stdout || resultado.error;
                    document.getElementById('bar-flash').style.width = '0%';
                    document.getElementById('bar-sram').style.width = '0%';
                    document.getElementById('text-flash').textContent = 'Error';
                    document.getElementById('text-sram').textContent = 'Error';
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.innerText = "⚙️ Compilar";
                btn.disabled = false;
            }
        });

        function parsearMemoria(stdout, stderr) {
            const texto = stdout + "\n" + stderr;
            const flashMatch = texto.match(/Sketch uses (\d+) bytes \((\d+)%\) of program storage space/);
            const sramMatch = texto.match(/Global variables use (\d+) bytes \((\d+)%\) of dynamic memory/);

            if (flashMatch) {
                const percent = parseInt(flashMatch[2]);
                const bar = document.getElementById('bar-flash');
                bar.style.width = `${percent}%`;
                bar.style.backgroundColor = percent > 80 ? '#e74c3c' : '#4fc08d';
                document.getElementById('text-flash').textContent = `${percent}% (${flashMatch[1]} b)`;
            }

            if (sramMatch) {
                const percent = parseInt(sramMatch[2]);
                const bar = document.getElementById('bar-sram');
                bar.style.width = `${percent}%`;
                bar.style.backgroundColor = percent > 80 ? '#e74c3c' : '#007acc';
                document.getElementById('text-sram').textContent = `${percent}% (${sramMatch[1]} b)`;
            }
        }

        // ==========================================
        // 7. SUBIR A LA PLACA
        // ==========================================
        document.getElementById('btnSubir').addEventListener('click', async () => {
            const btnSubir = document.getElementById('btnSubir');
            const btnCompilar = document.getElementById('btnCompilar');
            
            btnSubir.innerText = "⏳ Buscando puerto...";
            btnSubir.disabled = true;
            btnCompilar.disabled = true;
            
            try {
                const jsonPlacas = await window.api.detectarPlacas();
                const datos = JSON.parse(jsonPlacas);
                
                if (datos.detected_ports && datos.detected_ports.length > 0) {
                    const puerto = datos.detected_ports[0].port.address; // ej. "COM5"
                    btnSubir.innerText = `⏳ Subiendo a ${puerto}...`;

                    const codigoActual = editor.state.doc.toString();
                    const cliPath = 'C:\\ArduinoCLI\\arduino-cli.exe'; // Tu ruta
                    
                    const resultado = await window.api.subirAPlaca(codigoActual, cliPath, puerto);
                    
                    const consola = document.getElementById('console-output');
                    consola.style.display = 'block';

                    if (resultado.success) {
                        consola.style.color = '#4fc08d';
                        consola.textContent = `✅ ¡Código subido con éxito a ${puerto}!`;
                        parsearMemoria(resultado.stdout, resultado.stderr);
                        document.getElementById('memory-panel').style.display = 'block';
                    } else {
                        consola.style.color = '#f55';
                        consola.textContent = `❌ Error al subir:\n${resultado.stderr || resultado.stdout}`;
                    }
                } else {
                    alert("No se detectó ninguna placa conectada. Revisa el cable USB.");
                }
            } catch (err) {
                console.error(err);
                alert("Error al intentar comunicarse con la placa.");
            } finally {
                btnSubir.innerText = "🚀 Subir a la Placa";
                btnSubir.disabled = false;
                btnCompilar.disabled = false;
            }
        });

        // Iniciar aplicación
        cargarSVG();
    </script>
</body>
</html>
