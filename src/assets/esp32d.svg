<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="100%" height="100%">
  <defs>
    <style>
      .pcb { fill: #1a1a1a; stroke: #333333; stroke-width: 2; rx: 8; }
      .shield { fill: #c0c0c0; stroke: #999999; stroke-width: 1; rx: 4; }
      .chip { fill: #222222; stroke: #111111; stroke-width: 1; }
      .usb { fill: #888888; stroke: #666666; stroke-width: 1; rx: 2; }
      .pin-pad { fill: #d4af37; stroke: #997d26; stroke-width: 0.8; }
      .label { fill: #ffffff; font-family: Arial, sans-serif; font-size: 6px; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 9px; font-weight: bold; }
    </style>
  </defs>

  <!-- PCB Base -->
  <rect x="30" y="15" width="180" height="310" class="pcb" />

  <!-- USB Connector (Bottom) -->
  <rect x="95" y="310" width="50" height="25" class="usb" />
  <rect x="105" y="315" width="30" height="15" fill="#444444" rx="2" />

  <!-- ESP32 Antenna Area (Top) -->
  <path d="M 70 25 L 170 25 L 170 55 L 70 55 Z" fill="#111111" stroke="#333333" stroke-width="1" />
  <line x1="80" y1="35" x2="160" y2="35" stroke="#444444" stroke-width="1" />
  <line x1="80" y1="45" x2="160" y2="45" stroke="#444444" stroke-width="1" />

  <!-- ESP32 Shield (WROOM-32) -->
  <rect x="65" y="65" width="110" height="150" class="shield" />
  <!-- ESP32 Chip inside shield -->
  <rect x="95" y="110" width="50" height="50" class="chip" />
  <text x="120" y="138" class="label" font-size="8" text-anchor="middle">ESP32</text>

  <!-- Title on PCB -->
  <text x="120" y="240" class="title" text-anchor="middle">ESP32 DEVKIT V1</text>
  <text x="120" y="252" class="label" font-size="5" text-anchor="middle" fill="#888">ESP32-WROOM-32D</text>

  <!-- Left Header Pins (15 pins) -->
  <!-- We draw pads at x=35, y from 40 to 292 step 18 -->
  <!-- Right Header Pins (15 pins) -->
  <!-- We draw pads at x=205, y from 40 to 292 step 18 -->
</svg>
